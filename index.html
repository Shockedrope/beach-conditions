<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Beach Conditions Dashboard</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="top-bar">
    <div class="top-bar-inner">
      <h1><span class="wave">〜</span> Beach Conditions</h1>
      <div class="controls">
        <input id="search-input" type="search" placeholder="Search beach or city..." autocomplete="off" />
        <button id="favorites-toggle" class="toggle-btn" type="button">★ Favorites</button>
        <button id="refresh-btn" class="toggle-btn" type="button" title="Re-fetch all beaches">⟳ Refresh</button>
      </div>
    </div>
  </header>

  <main>
    <div id="status-banner"></div>
    <div id="grid" class="grid"></div>
  </main>

  <footer class="attribution">
    Beach condition reports sourced from
    <a href="https://visitbeaches.org" target="_blank" rel="noopener noreferrer">Mote Marine Laboratory's Beach Conditions Reporting System</a>.
    This is an unofficial, community-built dashboard and is not affiliated with Mote Marine Laboratory.
  </footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
